name: Docker CI

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    env:
      POSTGRES_DB: insightful_phish_ci
      POSTGRES_USER: insightful_phish
      POSTGRES_PASSWORD: ci-local-postgres-password
      DEMO_SEED_PASSWORD: ci-local-demo-password
      AUTH_TOKEN_SECRET: ci-auth-token-secret-that-is-very-long-indeed
      FRONTEND_ORIGIN: https://insightfulphish.co.za
      VITE_API_BASE_URL: https://api.insightfulphish.co.za
      SMTP_FROM_ADDRESS: noreply@insightfulphish.co.za

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate local Docker Compose config
        run: docker compose --profile tools config --quiet

      - name: Validate deployment Docker Compose config
        run: docker compose --env-file deploy/.env.example -f docker-compose.deploy.yml config --quiet

  docker-build-backend:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Backend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Frontend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=https://api.insightfulphish.co.za
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  docker-build-workspace:
    name: Docker Build (Workspace)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Build Workspace Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.workspace
          push: false
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
