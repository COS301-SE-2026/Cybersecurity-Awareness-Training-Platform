# cSpell:ignore pipefail ACMR

name: Policy

'on':
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  env-files:
    name: Env files
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check env files
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed_files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" || true)"

          if [ -z "$changed_files" ]; then
            echo "No changed files to check."
            exit 0
          fi

          blocked_files=()

          while IFS= read -r file; do
            basename="$(basename "$file")"

            if [ "$basename" = ".env.example" ]; then
              continue
            fi

            if [ "$basename" = "env" ] || [ "$basename" = ".env" ]; then
              blocked_files+=("$file")
              continue
            fi

            if [[ "$basename" =~ ^\.env\..+ ]] || [[ "$basename" =~ ^env\..+ ]]; then
              blocked_files+=("$file")
              continue
            fi
          done <<< "$changed_files"

          if [ "${#blocked_files[@]}" -gt 0 ]; then
            echo "Environment file policy failed."
            echo "The following environment files must not be committed:"
            printf '  - %s\n' "${blocked_files[@]}"
            echo ""
            echo "Only .env.example may be committed."
            exit 1
          fi

          echo "Environment file policy passed."

  pr-issue-link:
    name: PR issue link
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check PR issue link
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          pr_text="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY")"

          if echo "$pr_text" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|related to)[[:space:]]+#[0-9]+'; then
            echo "PR issue link policy passed."
            exit 0
          fi

          echo "PR issue link policy failed."
          echo "Include an issue reference in the PR title or body, for example:"
          echo "  Closes #123"
          echo "  Related to #123"
          exit 1
