# Continuous Integration Workflow
# This workflow runs on pull requests and pushes to main and dev branches.
# It includes formatting, linting, typechecking, testing, and building.

name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Formatting Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting check
        run: pnpm format:check

  lint:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run linting on changed files
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          backend_files=()
          frontend_files=()
          shared_files=()

          while IFS= read -r -d '' file; do
            case "$file" in
              apps/backend/src/generated/*|apps/backend/prisma/generated/*|apps/backend/generated/*)
                ;;
              apps/backend/*.ts|apps/backend/src/*.ts|apps/backend/src/**/*.ts|apps/backend/tests/*.ts|apps/backend/tests/**/*.ts|apps/backend/prisma/*.ts|apps/backend/scripts/*.ts)
                backend_files+=("${file#apps/backend/}")
                ;;
              apps/frontend/*.ts|apps/frontend/*.tsx|apps/frontend/src/*.ts|apps/frontend/src/*.tsx|apps/frontend/src/**/*.ts|apps/frontend/src/**/*.tsx|apps/frontend/tests/*.ts|apps/frontend/tests/*.tsx|apps/frontend/tests/**/*.ts|apps/frontend/tests/**/*.tsx)
                frontend_files+=("${file#apps/frontend/}")
                ;;
              packages/shared/*.ts|packages/shared/src/*.ts|packages/shared/src/**/*.ts)
                shared_files+=("${file#packages/shared/}")
                ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACMR "$base_sha" "$head_sha")

          if [[ "${#backend_files[@]}" -eq 0 && "${#frontend_files[@]}" -eq 0 && "${#shared_files[@]}" -eq 0 ]]; then
            echo "No lintable files changed."
            exit 0
          fi

          if [[ "${#backend_files[@]}" -gt 0 ]]; then
            pnpm --dir apps/backend exec eslint --max-warnings=0 "${backend_files[@]}"
          fi

          if [[ "${#frontend_files[@]}" -gt 0 ]]; then
            pnpm --dir apps/frontend exec eslint --max-warnings=0 "${frontend_files[@]}"
          fi

          if [[ "${#shared_files[@]}" -gt 0 ]]; then
            pnpm --dir packages/shared exec eslint --max-warnings=0 "${shared_files[@]}"
          fi

      - name: Run full linting
        if: ${{ github.event_name != 'pull_request' || github.base_ref != 'dev' }}
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run typecheck (backend)
        run: pnpm typecheck:backend

      - name: Run typecheck (frontend)
        run: pnpm typecheck:frontend

      - name: Run typecheck (shared)
        run: pnpm typecheck:shared

  unit-tests-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run backend unit tests
        run: pnpm test:coverage:ci:backend

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: apps/backend/coverage/

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./apps/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload backend test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./apps/backend/test-results.junit.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  unit-tests-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test:coverage:ci:frontend

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload frontend test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./apps/frontend/test-results.junit.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  unit-tests-shared:
    name: Unit Tests (Shared)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared unit tests
        run: pnpm test:coverage:ci:shared

      - name: Upload shared coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shared
          path: packages/shared/coverage/

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./packages/shared/coverage/lcov.info
          flags: shared
          name: shared-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload shared test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./packages/shared/test-results.junit.xml
          flags: shared
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightful_phish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run migrations
        run: pnpm --filter @insightful-phish/backend exec prisma migrate deploy

      - name: Run backend integration tests
        run: pnpm --filter @insightful-phish/backend test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Build (shared)
        run: pnpm build:shared

      - name: Build (backend)
        run: pnpm build:backend

      - name: Build (frontend)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm build:frontend

  docker-compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    env:
      POSTGRES_DB: insightful_phish_ci
      POSTGRES_USER: insightful_phish
      POSTGRES_PASSWORD: ci-local-postgres-password
      DEMO_SEED_PASSWORD: ci-local-demo-password
      AUTH_TOKEN_SECRET: ci-auth-token-secret-that-is-very-long-indeed
      FRONTEND_ORIGIN: https://insightfulphish.co.za
      VITE_API_BASE_URL: https://api.insightfulphish.co.za
      SMTP_FROM_ADDRESS: noreply@insightfulphish.co.za
      BACKEND_IMAGE: ghcr.io/example/insightfulphish/backend:ci
      FRONTEND_IMAGE: ghcr.io/example/insightfulphish/frontend:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate local Docker Compose config
        run: docker compose --profile tools config --quiet

      - name: Validate deployment Docker Compose config
        run: docker compose --env-file deploy/.env.example -f docker-compose.deploy.yml config --quiet

  docker-build-backend:
    name: Docker Build & Publish (Backend)
    needs:
      - format
      - lint
      - typecheck
      - unit-tests-backend
      - unit-tests-frontend
      - unit-tests-shared
      - integration-tests
      - build
      - docker-compose-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # 4.4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Backend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: |
            ${{ vars.GHCR_IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ vars.GHCR_IMAGE_PREFIX }}/backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  docker-build-frontend:
    name: Docker Build & Publish (Frontend)
    needs:
      - format
      - lint
      - typecheck
      - unit-tests-backend
      - unit-tests-frontend
      - unit-tests-shared
      - integration-tests
      - build
      - docker-compose-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # 4.4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Frontend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          build-args: |
            VITE_API_BASE_URL=https://api.insightfulphish.co.za
          tags: |
            ${{ vars.GHCR_IMAGE_PREFIX }}/frontend:${{github.sha}}
            ${{ vars.GHCR_IMAGE_PREFIX }}/frontend:dev
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-development:
    name: Deploy Development (Temporary)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - docker-build-backend
      - docker-build-frontend
    runs-on: ubuntu-latest
    environment:
      name: development
    timeout-minutes: 20
    concurrency:
      group: insightfulphish-development
      cancel-in-progress: false
