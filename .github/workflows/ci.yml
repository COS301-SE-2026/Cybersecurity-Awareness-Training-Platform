# Continuous Integration Workflow
# This workflow runs on pull requests and pushes to main and dev branches.
# It includes formatting, linting, typechecking, testing, and building.

name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting check
        run: pnpm format:check

  lint:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run linting
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run typecheck (backend)
        run: pnpm typecheck:backend

      - name: Run typecheck (frontend)
        run: pnpm typecheck:frontend

      - name: Run typecheck (shared)
        run: pnpm typecheck:shared

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run backend unit tests
        id: backend_unit_tests
        run: pnpm test:coverage:ci:backend
        continue-on-error: true

      - name: Run frontend unit tests
        id: frontend_unit_tests
        run: pnpm test:coverage:ci:frontend
        continue-on-error: true

      - name: Run shared unit tests
        id: shared_unit_tests
        run: pnpm test:coverage:ci:shared
        continue-on-error: true

      - name: Verify backend coverage
        if: ${{ steps.backend_unit_tests.outcome == 'success' }}
        run: ls -R apps/backend/coverage/

      - name: Verify frontend coverage
        if: ${{ steps.frontend_unit_tests.outcome == 'success' }}
        run: ls -R apps/frontend/coverage/

      - name: Verify shared coverage
        if: ${{ steps.shared_unit_tests.outcome == 'success' }}
        run: ls -R packages/shared/coverage/

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: apps/backend/coverage/

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/

      - name: Upload shared coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shared
          path: packages/shared/coverage/

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./apps/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: ${{ !cancelled() }}
        with:
          files: ./packages/shared/coverage/lcov.info
          flags: shared
          name: shared-coverage
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload backend test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./apps/backend/test-results.junit.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload frontend test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./apps/frontend/test-results.junit.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload shared test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: ./packages/shared/test-results.junit.xml
          flags: shared
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Fail if unit tests failed
        if: >-
          ${{
            steps.backend_unit_tests.outcome == 'failure' ||
            steps.frontend_unit_tests.outcome == 'failure' ||
            steps.shared_unit_tests.outcome == 'failure'
          }}
        run: exit 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightful_phish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Run migrations
        run: pnpm --filter @insightful-phish/backend exec prisma migrate deploy

      - name: Run backend integration tests
        run: pnpm --filter @insightful-phish/backend test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightful_phish_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @insightful-phish/backend exec prisma generate

      - name: Build (shared)
        run: pnpm build:shared

      - name: Build (backend)
        run: pnpm build:backend

      - name: Build (frontend)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm build:frontend

  docker-compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    env:
      POSTGRES_PASSWORD: ci-local-postgres-password
      DEMO_SEED_PASSWORD: ci-local-demo-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose config
        run: docker compose --profile tools config

  docker-build-backend:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Backend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Frontend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  docker-build-workspace:
    name: Docker Build (Workspace)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Build Workspace Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.workspace
          push: false
          cache-from: type=gha,scope=workspace
          cache-to: type-gha,scope=workspace,mode=max
