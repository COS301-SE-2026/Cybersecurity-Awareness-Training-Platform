services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - deploy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'ps_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:? Set AUTH_TOKEN_SECRET in deploy/.env}
      AUTH_TOKEN_EXPIRES_IN_SECONDS: ${AUTH_TOKEN_EXPIRES_IN_SECONDS:-28800}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-5}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in deploy/.env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in deploy/.env}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:- Insightful Phish}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-4000}:4000'
    command: sh -c "pnpm prisma:migrate:deploy && pnpm start"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((response)=> process.exit(response..ok? 0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in deploy.env}
      restart: unless-stopped
      ports:
        - '127.0.0.1:${FRONTEND_PORT:-5173}:8080'
      healthcheck:
        test: ['CMD-SHELL', 'wget -q -0 /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    expose:
      - 1025
    ports:
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'

  volumes:
    deploy_postgres_data:
      name: insightful_phish_deploy_postgres_data
