<line x1="336.7" y1="355" x2="336.7" y2="360" stroke="#EEDEFF"/><text x="336.7" y="382" font-family="Overpass, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#EEDEFF">6 Aug</text>
<line x1="603.3" y1="355" x2="603.3" y2="360" stroke="#EEDEFF"/><text x="603.3" y="382" font-family="Overpass, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#EEDEFF">7 Aug</text>
